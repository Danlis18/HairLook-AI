<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fcfaf6"><title>Your Hair Collection — HairLook AI</title><link rel="stylesheet" href="/styles.css"><script src="/dashboard.js" defer></script></head><body class="dashboard-page">
<header class="dashboard-header"><div class="container"><a class="logo" href="/"><span class="logo-mark"></span><span class="logo-name">HairLook AI</span></a><div class="dash-actions"><a class="btn btn-secondary btn-small" href="/">Home</a><button class="btn btn-ghost btn-small" id="logoutBtn">Sign out</button></div></div></header>
<main class="dash-main"><div class="container"><div id="paymentGate" hidden></div><section id="dashboardContent" hidden><div class="dash-hero"><div><div class="eyebrow">Your private collection</div><h1>Your Hair Collection</h1><p id="dashSubtitle">Your results appear here as soon as each preview is ready.</p></div><div class="progress-card"><div class="progress-card-top"><strong id="progressText">0 of 30 looks ready</strong><span id="progressPercent">0%</span></div><div class="result-progress"><div id="progressBar" style="width:0"></div></div></div></div><div class="profile-strip" id="profileStrip"></div><div id="resultSections"></div><section class="danger-zone"><div><strong>Want your data removed?</strong><p>This permanently deletes your account record and any remaining private photos/results tied to it.</p></div><button class="btn btn-secondary btn-small" id="deleteAccount">Delete my data</button></section></section></div></main>
<div class="result-modal" id="resultModal" aria-hidden="true"><div class="result-dialog"><div class="result-dialog-image"><img id="modalImage" alt="Hairstyle result"></div><div class="result-dialog-copy"><button class="modal-close" id="modalClose" aria-label="Close result">×</button><span class="result-category" id="modalCategory"></span><h2 id="modalTitle"></h2><div class="result-why" id="modalWhy"></div><div class="result-actions"><a class="btn btn-primary" id="modalDownload" href="#">Download</a><button class="btn btn-secondary" id="modalDone">Done</button></div></div></div></div>
</body></html>
